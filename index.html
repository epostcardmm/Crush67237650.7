<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Special Question For You ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #1d092b 0%, #3a1c4d 40%, #682d5f 70%, #d8698b 100%);
      overflow: hidden;
      position: relative;
      color: #ffffff;
    }

    /* Container အဖြူကြီး မရှိသော Frameless Container */
    .container {
      background: transparent;
      padding: 20px;
      text-align: center;
      max-width: 480px;
      width: 95%;
      z-index: 10;
      transition: all 0.4s ease;
    }

    /* --- Frameless GIF Styles (Frame / Shadow / Border လုံးဝမပါသော ပုံစံ) --- */
    .frameless-gif-container {
      display: inline-block;
      cursor: pointer;
      transition: transform 0.3s ease;
      margin: 15px 0;
    }

    .frameless-gif-container:hover {
      transform: scale(1.1);
    }

    .frameless-gif {
      width: 190px;
      height: 190px;
      object-fit: contain;
      border: none !important;
      outline: none !important;
      box-shadow: none !important;
      background: transparent !important;
      mix-blend-mode: multiply; /* GIF နောက်ခံအဖြူကို နောက်ခံနဲ့ ရောသွားစေရန် */
    }

    .gif-container {
      display: inline-block;
      margin-bottom: 20px;
    }

    .gif-container img {
      width: 180px;
      height: 180px;
      object-fit: contain;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
      mix-blend-mode: multiply;
    }

    h1 {
      font-size: 22px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.4);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      position: relative;
    }

    button {
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
    }

    .btn-yes {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: white;
      box-shadow: 0 6px 20px rgba(255, 65, 108, 0.5);
    }

    .btn-yes:hover {
      background: linear-gradient(135deg, #ff2a5f 0%, #ff3111 100%);
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(255, 65, 108, 0.7);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(5px);
      position: relative;
      transition: all 0.2s ease-out;
    }

    .btn-no:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .btn-card {
      background: linear-gradient(135deg, #f857a6 0%, #ff5858 100%);
      color: white;
      margin-top: 15px;
      box-shadow: 0 6px 20px rgba(248, 87, 166, 0.5);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    /* --- YouTube Video Section Styles --- */
    .video-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
      height: 0;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      margin-top: 15px;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    .video-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .instruction-text {
      font-size: 14px;
      color: #f1c40f;
      margin-top: 15px;
      font-style: italic;
      text-shadow: 0 1px 5px rgba(0,0,0,0.5);
    }

    .warning-popup {
      position: absolute;
      padding: 12px 20px;
      background: rgba(20, 10, 25, 0.9);
      color: #ff85a2;
      font-size: 14px;
      font-weight: bold;
      border-radius: 12px;
      border: 1px solid #ff416c;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      pointer-events: none;
      animation: popup 1.5s ease-out forwards;
      z-index: 100;
    }

    @keyframes popup {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      20% { opacity: 1; transform: translateY(-10px) scale(1.1); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-30px) scale(1); }
    }
  </style>
</head>
<body>

  <div class="container" id="mainContainer">
    <h1 style="color: #ffb3c1; font-size: 24px; font-weight: bold; margin-bottom: 10px;">A Special Message For You.. ✨</h1>
    <div class="frameless-gif-container" onclick="startJourney(event)">
      <img src="https://media.tenor.com/v63_brUy45wAAAAi/peach-goma-love-peach-cat.gif" alt="Cute Heart GIF" class="frameless-gif" id="startGif">
    </div>
    <p style="font-size: 14px; color: #e0b0ff; font-style: italic;">👆 Click Here</p>
  </div>

  <script>
    // နှလုံးသားများ ပျံထွက်စေပြီး ပထမအဆင့် (မေးခွန်းစာမျက်နှာ) သို့ ကူးပြောင်းရန်
    function startJourney(event) {
      const gif = document.getElementById('startGif');
      const rect = gif.getBoundingClientRect();
      const centerX = rect.left + rect.width / 2;
      const centerY = rect.top + rect.height / 2;

      // GIF ထဲကနေ နှလုံးသားနဲ့ ကြယ်ပွင့်လေးတွေ ပျံထွက်လာစေခြင်း
      for (let i = 0; i < 22; i++) {
        const heart = document.createElement('div');
        heart.innerText = ['❤️', '💖', '✨', '💕', '💗', '💞'][Math.floor(Math.random() * 6)];
        heart.style.position = 'fixed';
        heart.style.left = centerX + 'px';
        heart.style.top = centerY + 'px';
        heart.style.fontSize = (Math.random() * 18 + 14) + 'px';
        heart.style.pointerEvents = 'none';
        heart.style.zIndex = '1000';
        document.body.appendChild(heart);

        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 140 + 60;
        const targetX = centerX + Math.cos(angle) * distance;
        const targetY = centerY + Math.sin(angle) * distance;

        heart.animate([
          { transform: 'translate(0, 0) scale(0.4)', opacity: 1 },
          { transform: `translate(${targetX - centerX}px, ${targetY - centerY}px) scale(1.6)`, opacity: 0 }
        ], {
          duration: 900,
          easing: 'cubic-bezier(0, .9, .57, 1)'
        }).onfinish = () => heart.remove();
      }

      // ခဏလေး (0.4 စက္ကန့်) စောင့်ပြီး ဖိုင်ရဲ့ ပထမအဆင့် (မေးခွန်းစာမျက်နှာ) ကို ပြသပေးမည်
      setTimeout(() => {
        loadMainQuestionPage();
      }, 400);
    }

    // မူလ မေးခွန်းစာမျက်နှာ (Step 1)
    function loadMainQuestionPage() {
      const container = document.getElementById('mainContainer');
      container.innerHTML = `
        <div class="gif-container">
          <img src="https://media.tenor.com/OQkebuD8EgMAAAAj/peach-cat-peach-and-goma.gif" alt="Cute Gif">
        </div>
        <h1 id="questionText">Do You Love Me ?😊</h1>
        <div class="btn-group">
          <button class="btn-yes" id="yesBtn" onclick="handleYes()">YES</button>
          <button class="btn-no" id="noBtn" onclick="handleNo()">NO</button>
        </div>
      `;
    }

    const warnings = [
      "Sure?",
      "Can't, Pick Yes 💔",
      "Don't Click 😭",
      "Please... 🙏",
      "Accept me.. ✨",
      "Don't Reject.. 🙈"
    ];

    let warningIndex = 0;
    let yesScale = 1;

    function handleNo() {
      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');

      const maxX = window.innerWidth - noBtn.offsetWidth - 20;
      const maxY = window.innerHeight - noBtn.offsetHeight - 20;

      const randomX = Math.max(10, Math.floor(Math.random() * maxX));
      const randomY = Math.max(10, Math.floor(Math.random() * maxY));

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;

      yesScale += 0.15;
      yesBtn.style.transform = `scale(${yesScale})`;

      showWarning(randomX, randomY);
    }

    function showWarning(x, y) {
      const warning = document.createElement('div');
      warning.className = 'warning-popup';
      warning.innerText = warnings[warningIndex % warnings.length];
      warningIndex++;

      warning.style.left = `${Math.min(window.innerWidth - 180, x)}px`;
      warning.style.top = `${Math.max(10, y - 40)}px`;

      document.body.appendChild(warning);

      setTimeout(() => {
        warning.remove();
      }, 1500);
    }

    function handleYes() {
      const container = document.getElementById('mainContainer');
      
      container.innerHTML = `
        <div class="gif-container">
          <img src="https://media.tenor.com/wIev1fUt-M8AAAAi/peach-goma-peach-and-goma.gif" alt="Happy Gif">
        </div>
        <h1>Yess..I Knew It, I Love You Too ❤️</h1>
        <button class="btn-card" onclick="goToEpostcardPage()">Video ePostcard For You ✉️</button>
      `;
    }

    // YouTube Video ပါဝင်သော စာမျက်နှာ
    function goToEpostcardPage() {
      const container = document.getElementById('mainContainer');
      
      container.innerHTML = `
        <h1 style="margin-bottom: 10px; color: #ffb3c1; font-size: 20px;">🎬 A Special Video For You ❤️</h1>
        <div class="video-container">
<iframe width="560" height="315" src="https://www.youtube.com/embed/Rirh4x6B0Qo?si=pFuYcKoYRfRUp7Gg&amp;controls=0" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>`;
    }
  </script>
</body>
</html>
